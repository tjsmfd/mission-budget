      </section>`;
      html += `<div class="sechead"><h2>Categories</h2><span>left this month</span></div>`;
      for (const g of GROUPS){
        const list = cats().filter((c) => c.group === g);
        if (!list.length) continue;
        html += `<div class="gtitle"><span class="dot" style="--gc:${GC[g]}"></span>${g}</div><div class="list">`;
        for (const c of list){
          const isFun = roleOf(c) === "fun", firstFun = isFun && cats().find((x) => roleOf(x) === "fun") === c;
          const covered = firstFun ? m.funCover : 0;
          const ov = m.overs.find((o) => o.id === c.id);
          const b = num(c.budget) + (firstFun ? m.pocketExtra : 0), sp = m.spent[c.id] || 0, left = b - sp - covered;
          const q = b ? (sp + covered) / b : (sp > 0 ? 2 : 0);
          const isBill = roleOf(c) === "bill";
          const billPaid = isBill && b > 0 && sp >= b * 0.97;
          const notDue = isBill && !billPaid && (S.billSkip[k] || []).includes(c.id);
          // Spending categories: green under 60% used, yellow under 80%, red at 80% or more.
          const lvl = isBill ? "" : q >= 0.8 ? "bad" : q >= 0.6 ? "mid" : "good";
          const cls = billPaid ? "paid" : isBill ? (q > 1 ? "over" : "") : lvl === "bad" ? "over" : lvl === "mid" ? "warn" : "paid";
          const amtTxt = billPaid ? "Paid" : notDue ? "Not due" : money(left);
          const amtCls = billPaid ? "paidtxt" : notDue ? "muted" : isBill ? (left < 0 ? "neg" : "") : "lvl-" + lvl;
          let meta = billPaid ? `${money(sp)} paid this month${sp - b > 0.005 ? " · " + money(sp - b) + " more than budgeted" : ""}` : notDue ? `${money(b, 0)} · not due until next month` : `${money(sp)} of ${money(b, 0)}${isBill ? " · bill" : ""}`;
          if (isBill && !billPaid && !notDue && fc){
            const bn = billNote(c, fc, k);
            if (bn) meta += `<span class="billnote ${bn.ok ? "ok" : "short"}">${bn.text}</span>`;
          }
          if (ov && !billPaid) meta += ` · <span style="color:var(--red)">${money(ov.amount)} over</span>`;
          if (ov && m.coverOver) meta += ` · <span style="color:var(--warn)">taken from pocket money</span>`;
          if (covered > 0) meta += ` · <span style="color:var(--warn)">−${money(covered)} covering overspending</span>`;
          html += `<button type="button" class="catrow" data-log="${esc(c.id)}" aria-label="${esc(c.name)}: ${esc(amtTxt)}. Tap to log.">
            <span class="l1"><span class="name"><span class="dot" style="--gc:${GC[g]}"></span><span>${esc(c.name)}</span></span><span class="amt ${amtCls}">${amtTxt}</span></span>
            <span class="bar" style="--gc:${GC[g]}"><i class="${cls}" style="width:${Math.min(100, q * 100)}%"></i></span>
            <span class="meta">${meta}</span></button>`;
        }
        html += "</div>";
      }
      html += '<p class="foot">Tap a category to log a purchase in it</p>';
    }
    app.innerHTML = html;
    wirePocket(pn);
  }

  // ---------------- accounts ----------------
  const asOfText = (iso) => { if (!iso) return ""; const days = Math.floor((Date.now() - new Date(iso).getTime()) / 864e5); return days <= 0 ? "updated today" : days === 1 ? "updated yesterday" : "updated " + days + " days ago"; };
  function accountsCard(){
    const a = S.accounts;
    if (!a || (a.checking == null && a.savings == null)){
      return `<section class="card" aria-label="Accounts" style="display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 18px"><div><h2>Accounts</h2><div class="meta">Add your checking and savings balances</div></div><button type="button" class="pillbtn" data-accounts>Add</button></section>`;
    }
    const lb = liveBalances() || {checking: a.checking, savings: a.savings, n: 0};
    const rows = [["Checking", lb.checking], ["Savings", lb.savings]].filter(([, v]) => v != null);
    const total = rows.reduce((s, [, v]) => s + num(v), 0);
    const efund = lb.savings != null ? (S.goals.find((g) => g.id === "g-emergency") || S.goals.find((g) => /emergenc/i.test(g.name || ""))) : null;
    return `<section class="card" aria-label="Accounts" style="display:flex;flex-direction:column;gap:4px;padding:16px 18px">
      <div class="l1"><h2>Accounts</h2><button type="button" class="pillbtn ghost" data-accounts>Update</button></div>
      ${rows.map(([n, v]) => `<div class="srcrow"><span>${n}${lb.n ? ' <span class="muted" style="font-size:12px">est.</span>' : ""}</span><b>${money(num(v))}</b></div>`).join("")}
      ${efund ? `<div class="srcrow" style="padding-left:14px;border-left:2px solid var(--savings);margin-left:2px"><span>Emergency fund <span class="muted" style="font-size:12px">part of savings</span></span><b style="color:var(--savings)">${money(goalBalance(efund))}</b></div>` : ""}
      <div class="srcrow"><span class="muted">Total · ${esc(asOfText(a.asOf))}</span><b>${money(total)}</b></div>
      ${lb.n ? `<p class="hint" style="margin:4px 0 0">Estimated: your last bank balance plus ${lb.n} ${lb.n === 1 ? "entry" : "entries"} logged since. Update from your bank app to reset it.</p>` : ""}
    </section>`;
  }
  function accountsLine(inGoals){
    const a = S.accounts;
    if (!a || a.savings == null) return '<span class="sub">Add your savings balance (Today → Accounts) to see how much of it is assigned to goals.</span>';
    const free = num(a.savings) - inGoals;
    return `<span class="sub">Savings account ${money(num(a.savings))} · ${free >= 0 ? money(free) + " not in a goal yet" : `<span style="color:var(--warn)">goals are ${money(-free)} more than your savings account</span>`}</span>`;
  }
  function openAccounts(){
    const a = S.accounts || {};
    const lb = liveBalances();
    const estC = lb ? lb.checking : null, estS = lb ? lb.savings : null;
    const {close, el} = sheet("Account balances", `
      <p class="sub" style="margin:0;font-size:14px">Copy the current balances from your bank app. If they don't match the app's estimate, the difference is saved as a balance adjustment in History so you can see what was missing.</p>
      <div><label class="lab" for="acChk">Checking</label><input class="field num" id="acChk" inputmode="decimal" value="${estC != null ? estC : a.checking != null ? num(a.checking) : ""}" placeholder="$0">${estC != null ? `<div class="meta" style="margin-top:4px">App estimate: ${money(estC)}</div>` : ""}</div>
      <div><label class="lab" for="acSav">Savings</label><input class="field num" id="acSav" inputmode="decimal" value="${estS != null ? estS : a.savings != null ? num(a.savings) : ""}" placeholder="$0">${estS != null ? `<div class="meta" style="margin-top:4px">App estimate: ${money(estS)}</div>` : ""}</div>
      <div id="adjBox" hidden><p class="hint" id="adjTxt" style="margin:0"></p><label class="lab" for="adjNote" style="margin-top:8px">What was missing? (optional)</label><input class="field" id="adjNote" autocomplete="off" placeholder="Example: phone bill"></div>
      <button type="button" class="save" id="acSave">Save balances</button>`);
    const diffs = () => {
      const c = el.querySelector("#acChk").value.trim(), s2 = el.querySelector("#acSav").value.trim();
      const dc = estC != null && c !== "" ? round2(num(c) - estC) : 0, ds = estS != null && s2 !== "" ? round2(num(s2) - estS) : 0;
      return {c, s2, dc: Math.abs(dc) >= 0.01 ? dc : 0, ds: Math.abs(ds) >= 0.01 ? ds : 0};
    };
    const sync = () => {
      const d = diffs(), box = el.querySelector("#adjBox");
      box.hidden = !(d.dc || d.ds);
      const sg = (x) => (x < 0 ? "−" : "+") + money(Math.abs(x));
      el.querySelector("#adjTxt").textContent = [d.dc ? "Checking is " + sg(d.dc) + " from the estimate." : "", d.ds ? "Savings is " + sg(d.ds) + " from the estimate." : ""].filter(Boolean).join(" ") + " It will be saved as a balance adjustment.";
    };
    el.querySelector("#acChk").oninput = sync; el.querySelector("#acSav").oninput = sync; sync();
    el.querySelector("#acSave").onclick = async () => {
      const d = diffs(), c = d.c, s2 = d.s2, now = new Date();
      const adjustments = [...(a.adjustments || [])];
      if (d.dc || d.ds) adjustments.push({id: "adj" + now.getTime(), ts: now.toISOString(), date: ymd(now), note: el.querySelector("#adjNote").value.trim(), chk: d.dc ? {est: estC, actual: round2(num(c))} : null, sav: d.ds ? {est: estS, actual: round2(num(s2))} : null});
      const body = {checking: c === "" ? null : round2(num(c)), savings: s2 === "" ? null : round2(num(s2)), asOf: now.toISOString(), adjustments};
      S.accounts = body; render();
      if (S.db) try { await S.db.doc("config/accounts").set(body); } catch (e){ toast("Couldn't save balances. Try again."); return; }
      close(); toast(d.dc || d.ds ? "Balances saved · adjustment logged" : "Balances saved");
    };
    setTimeout(() => el.querySelector("#acChk").focus(), 50);
  }

  function openBills(){
    const k = monthKey(new Date());
    const m = monthStats(k);
    const bills = cats().filter((c) => roleOf(c) === "bill");
    let skip = [...(S.billSkip[k] || [])];
    const row = (c) => {
      const left = Math.max(0, num(c.budget) - (m.spent[c.id] || 0));
      const paid = left === 0;
      return `<div class="splitrow" style="grid-template-columns:minmax(0,1fr) auto"><div style="min-width:0"><div class="t1">${esc(c.name)}</div><div class="t2">${paid ? "Paid this month" : money(left) + " still to pay"}</div></div>
        ${paid ? '<span class="chipline ok">Paid</span>' : `<div class="seg" role="group" aria-label="${esc(c.name)} due" style="flex:none"><button type="button" data-due="${esc(c.id)}" data-v="1" aria-pressed="${!skip.includes(c.id)}">Due</button><button type="button" data-due="${esc(c.id)}" data-v="0" aria-pressed="${skip.includes(c.id)}">Not this month</button></div>`}</div>`;
    };
    const {close, el} = sheet("Bills this month", `
      <p class="sub" style="margin:0;font-size:14px">Bills marked Due are held back from your checking before Free to spend is checked. Mark one Not this month if it isn't coming out until next month. Once you log a bill's payment, it shows as Paid.</p>
      <div>${bills.map(row).join("") || '<p class="empty">No categories are marked Bill. Set roles in Plan.</p>'}</div>
      <button type="button" class="save" id="billSave">Done</button>`);
    el.querySelectorAll("[data-due]").forEach((b) => b.onclick = () => {
      const id = b.dataset.due;
      skip = skip.filter((x) => x !== id); if (b.dataset.v === "0") skip.push(id);
      el.querySelectorAll(`[data-due="${id}"]`).forEach((x) => x.setAttribute("aria-pressed", (x.dataset.v === "0") === skip.includes(id)));
    });
    el.querySelector("#billSave").onclick = async () => {
      S.billSkip = {...S.billSkip, [k]: skip}; render(); close();
      if (S.db) try { await S.db.doc("config/billskip").set(S.billSkip); } catch (e){ toast("Couldn't save that. Try again."); }
    };
  }

  // ---------------- goals ----------------
  function goalStatus(g){
    const bal = goalBalance(g), target = num(g.target), monthly = num(g.monthly);
    if (g.kind === "setaside") return ["info", "Set-aside · " + (monthly ? money(monthly, 0) + "/mo" : "no monthly amount yet")];
    if (target > 0 && bal >= target) return ["ok", "Goal reached"];
    if (target > 0 && g.date){
      const need = (target - bal) / monthsUntil(g.date);
      if (monthly + 0.5 >= need) return ["ok", "On track"];
      return ["warn", "Needs " + money(need, 0) + "/mo to hit date"];
    }
    return ["info", monthly ? money(monthly, 0) + "/mo planned" : "No monthly amount"];
  }
  function renderGoals(){
    const k = monthKey(new Date());
    const total = S.goals.reduce((s, g) => s + goalBalance(g), 0);
    const thisMonth = S.goals.reduce((s, g) => s + goalAddedIn(g, k), 0);
    let html = `
      <div class="headrow"><div class="head"><span class="date">Savings</span><h1>Goals</h1></div>${helpBtn()}</div>
      ${S.goals.some((g) => g.example) ? '<div class="notice"><span>Example goals are below. Edit them to match what you\'re saving for, or delete them.</span></div>' : ""}
      <section class="card" aria-label="Goals summary" style="display:flex;flex-direction:column;gap:6px">
        <span class="sub" style="font-size:14px">Set aside across goals and set-asides</span>
        <span class="big" style="color:var(--savings)">${money(total)}</span>
        <span class="sub">${money(thisMonth)} added this month · ${money(goalsMonthly(), 0)}/mo planned</span>
        ${accountsLine(total)}
      </section>`;
    if (!S.goalsLoaded && S.status !== "offline") html += '<p class="empty">Loading your goals…</p>';
    else if (!S.goals.length) html += '<p class="empty">No goals yet. Add the thing you\'re saving for, how much it costs, and when you want it.</p>';
    for (const g of S.goals){
      const bal = goalBalance(g), target = g.kind === "setaside" ? 0 : num(g.target);
      const pct = target > 0 ? Math.min(100, (bal / target) * 100) : 0;
      const [cls, label] = goalStatus(g);
      const recent = [...(g.entries || [])].sort((a, b) => (b.date + (b.ts || "")).localeCompare(a.date + (a.ts || ""))).slice(0, 3);
      html += `<section class="goal" aria-label="${esc(g.name)}">
        <div class="top"><div style="min-width:0"><h3>${esc(g.name || "Untitled goal")}</h3><div class="meta">${g.kind === "setaside" ? "Set-aside: add each paycheck, spend with Use money" : target > 0 ? "Target " + money(target, 0) + (g.due ? " by " + esc(prettyDate(g.due, {month: "short", day: "numeric"})) : g.date ? " by " + esc(prettyDate(g.date, {month: "short", year: "numeric"})) : "") : "Ongoing, no target"}</div></div>
          <button type="button" class="iconbtn" data-goal-edit="${esc(g.id)}" aria-label="Edit ${esc(g.name)}">${IC.edit}</button></div>
        <div class="bal">${money(bal)} ${target > 0 ? `<small>of ${money(target, 0)}</small>` : g.kind === "setaside" ? "<small>available</small>" : ""}</div>
        ${target > 0 ? `<div class="bar" style="--gc:var(--savings)"><i style="width:${pct}%"></i></div>` : ""}
        <div><span class="chipline ${cls}">${esc(label)}</span> <span class="meta">&nbsp;${money(goalAddedIn(g, k), 0)} added this month</span></div>
        ${recent.length ? `<div class="entries">${recent.map((e) => `<button type="button" class="entrybtn" data-edit-entry="${esc(e.id)}" data-goal="${esc(g.id)}" aria-label="Edit entry"><span>${esc(prettyDate(e.date, {month: "short", day: "numeric"}))} · ${esc(e.note || (num(e.amount) < 0 ? "Used" : "Added"))}</span><span style="color:${num(e.amount) < 0 ? "var(--red)" : "var(--savings)"}">${num(e.amount) < 0 ? "−" : "+"}${money(Math.abs(num(e.amount)))}</span></button>`).join("")}</div>` : ""}
        <div class="acts"><button type="button" class="pillbtn" data-goal-add="${esc(g.id)}">Add money</button><button type="button" class="pillbtn ghost" data-goal-use="${esc(g.id)}">Use money</button></div>
      </section>`;
    }
    html += '<button type="button" class="addbtn" id="newGoal">+ New goal or set-aside</button>';
    app.innerHTML = html;
    document.getElementById("newGoal").onclick = () => openGoalEdit(null);
  }

  // ---------------- month review ----------------
  const DD_RE = /door\s*dash/i;
  function ddStats(k){
    const tx = (S.months[k] || []).filter((t) => t.type === "income" && DD_RE.test(t.note || ""));
    const byDay = {};
    let total = 0, toPocket = 0, biggest = 0;
    for (const t of tx){ const a = num(t.amount); total += a; toPocket += num(t.pocket); biggest = Math.max(biggest, a); byDay[t.date] = (byDay[t.date] || 0) + a; }
    const days = Object.keys(byDay).sort();
    let best = null; for (const d of days) if (!best || byDay[d] > best.amount) best = {date: d, amount: byDay[d]};
    const wk = {}; for (const d of days){ const [y, m, dd] = d.split("-").map(Number); const n = new Date(y, m - 1, dd).toLocaleString("en-US", {weekday: "long"}); wk[n] = (wk[n] || 0) + 1; }
    const topDay = Object.keys(wk).sort((a, b) => wk[b] - wk[a])[0] || "";
    const [y, m] = k.split("-").map(Number), dim = new Date(y, m, 0).getDate();
    return {n: tx.length, total: round2(total), toPocket: round2(toPocket), biggest, days: days.length, best, topDay, topDayN: wk[topDay] || 0, avgEntry: tx.length ? total / tx.length : 0, avgDay: days.length ? total / days.length : 0, perWeek: days.length / (dim / 7), dim};
  }
  const roundUp5 = (n) => Math.ceil(n / 5 - 1e-9) * 5;
  function renderReview(){
    const k = S.revMonth || monthKey(new Date());
    ensureMonth(k); ensureMonth(shiftMonth(k, -1));
    const loaded = k in S.months;
    const m = monthStats(k), isNow = k === monthKey(new Date());
    const dd = ddStats(k), prev = (shiftMonth(k, -1) in S.months) ? ddStats(shiftMonth(k, -1)) : null;
    // categories over budget (pocket money is shown on its own)
    const over = [], within = [];
    for (const c of cats()){
      if (roleOf(c) === "fun") continue;
      const b = num(c.budget), sp = m.spent[c.id] || 0, d = round2(sp - b);
      (d >= 1 ? over : within).push({c, b, sp, d});
    }
    over.sort((a, b) => b.d - a.d);
    const pocketNet = round2(m.funBudget - m.funSpent - m.funCover);
    const pocketOver = pocketNet < 0 ? -pocketNet : 0;
    const funCats = cats().filter((c) => roleOf(c) === "fun");
    const goalRows = S.goals.filter((g) => num(g.monthly) > 0).map((g) => ({g, plan: num(g.monthly), got: goalAddedIn(g, k)}));
    const goalShort = goalRows.filter((r) => r.plan - r.got >= 1);
    const row = (l, r, color) => `<span class="orow" style="display:flex;justify-content:space-between;gap:10px"><span>${l}</span><span style="${color ? "color:" + color + ";" : ""}font-weight:700">${r}</span></span>`;
    // take-aways: plain statements you can act on when you edit the plan
    const tips = [];
    if (pocketOver > 0) tips.push(`Pocket money ran ${money(pocketOver)} over. Either raise it to about ${money(roundUp5(m.funBudget + pocketOver), 0)} in Plan or plan for fewer purchases.`);
    else if (m.funBudget > 0 && pocketNet >= 1) tips.push(isNow ? `Pocket money has ${money(pocketNet)} left so far.` : `Pocket money finished with ${money(pocketNet)} left. That can stay as is or move toward a goal.`);
    const adjC = ((S.accounts || {}).adjustments || []).filter((j) => j.date.startsWith(k) && j.chk).reduce((t, j) => t + (j.chk.actual - j.chk.est), 0);
    if (Math.abs(adjC) >= 1) tips.push(`Your checking was ${money(Math.abs(adjC))} ${adjC < 0 ? "lower" : "higher"} than the app expected after balance updates. Something was ${adjC < 0 ? "spent but not logged" : "received but not logged"}.`);
    for (const o of over.slice(0, 4)) tips.push(`${o.c.name} was ${money(o.d)} over (${money(o.sp)} spent on ${money(o.b, 0)}). A budget of about ${money(roundUp5(o.sp), 0)} would have fit.`);
    for (const r of goalShort.slice(0, 3)) tips.push(`${r.g.name || "A goal"} got ${money(r.got)} of the ${money(r.plan, 0)} planned (${money(r.plan - r.got)} short).`);
    if (dd.n) tips.push(`DoorDash brought in ${money(dd.total)} over ${dd.days} ${dd.days === 1 ? "day" : "days"}${prev && prev.n ? ` (${dd.total >= prev.total ? "up" : "down"} ${money(Math.abs(dd.total - prev.total))} from last month)` : ""}.`);
    const ovTotal = over.reduce((a, o) => a + o.d, 0);
    let html = `
      <div class="headrow"><div class="head"><span class="date">${isNow ? "So far this month" : "Month review"}</span></div><button type="button" class="iconbtn" data-go="history" aria-label="Back to History">${IC.x}</button></div>
      <div class="monthnav">
        <button type="button" class="iconbtn" id="rPrev" aria-label="Previous month">${IC.l}</button>
        <h1 style="font-size:22px">${esc(monthName(k))}</h1>
        <button type="button" class="iconbtn" id="rNext" aria-label="Next month">${IC.r}</button>
      </div>`;
    if (!loaded){ app.innerHTML = html + '<p class="empty">Loading…</p>'; wireReview(k); return; }
    if (!m.tx.length && !goalRows.length){ app.innerHTML = html + '<p class="empty">Nothing logged in this month, so there is nothing to review yet.</p>'; wireReview(k); return; }
    html += `<div class="stats">
        <div class="stat"><span class="l">Over budget</span><span class="v" style="${ovTotal + pocketOver > 0 ? "color:var(--red)" : ""}">${money(ovTotal + pocketOver, 0)}</span></div>
        <div class="stat"><span class="l">Pocket money</span><span class="v" style="${pocketNet < 0 ? "color:var(--red)" : ""}">${pocketNet < 0 ? "−" : ""}${money(Math.abs(pocketNet), 0)}</span></div>
        <div class="stat"><span class="l">DoorDash</span><span class="v">${money(dd.total, 0)}</span></div>
      </div>`;
    if (tips.length) html += `<section class="card" aria-label="Notes for next month" style="display:flex;flex-direction:column;gap:8px"><h2>Notes for next month</h2>${tips.map((t) => `<p style="margin:0;font-size:14px;line-height:1.45">• ${esc(t)}</p>`).join("")}</section>`;
    // pocket money
    html += `<section class="card" aria-label="Pocket money" style="display:flex;flex-direction:column;gap:8px"><h2>Pocket money</h2>
      ${row("Budget" + (m.pocketExtra ? ` <span class="sub">(includes ${money(m.pocketExtra)} side income)</span>` : ""), money(m.funBudget))}
      ${row("Spent", money(m.funSpent))}
      ${m.funCover > 0 ? row("Taken to cover other overspending", money(m.funCover), "var(--warn)") : ""}
      ${row(pocketNet < 0 ? "Over by" : "Left over", money(Math.abs(pocketNet)), pocketNet < 0 ? "var(--red)" : "var(--ok)")}
      ${m.foodN ? `<span class="sub">Ate out ${m.foodN}× for ${money(m.foodSpent)} · random ${money(Math.max(0, m.funSpent - m.foodSpent))}</span>` : ""}
      ${funCats.length > 1 ? funCats.map((c) => row(esc(c.name), money(m.spent[c.id] || 0) + " of " + money(num(c.budget), 0))).join("") : ""}
    </section>`;
    // other categories
    html += `<section class="card" aria-label="Categories" style="display:flex;flex-direction:column;gap:8px"><h2>Categories</h2>`;
    if (!over.length) html += '<p class="sub" style="margin:0">Nothing went over budget.</p>';
    for (const o of over) html += row(esc(o.c.name) + ` <span class="sub">${money(o.sp)} of ${money(o.b, 0)}</span>`, "+" + money(o.d), "var(--red)");
    if (within.length) html += `<details class="gd" style="margin-top:4px"><summary>Within budget (${within.length})</summary><div class="gbody">${within.map((o) => row(esc(o.c.name) + ` <span class="sub">${money(o.sp)} of ${money(o.b, 0)}</span>`, o.b - o.sp >= 1 ? money(o.b - o.sp) + " left" : "on budget", "var(--ok)")).join("")}</div></details>`;
    html += `</section>`;
    // goals
    if (goalRows.length) html += `<section class="card" aria-label="Goals" style="display:flex;flex-direction:column;gap:8px"><h2>Goals</h2>${goalRows.map((r) => { const d = round2(r.got - r.plan); return row(esc(r.g.name || "Goal") + ` <span class="sub">${money(r.got)} of ${money(r.plan, 0)}</span>`, d <= -1 ? money(-d) + " short" : d >= 1 ? "+" + money(d) + " extra" : "on plan", d <= -1 ? "var(--warn)" : "var(--ok)"); }).join("")}<span class="sub">Compared with the monthly amounts in your current plan.</span></section>`;
    // DoorDash
    html += `<section class="card" aria-label="DoorDash" style="display:flex;flex-direction:column;gap:8px"><h2>DoorDash</h2>`;
    if (!dd.n) html += '<p class="sub" style="margin:0">No DoorDash income logged this month. Put “DoorDash” in the note when you log it and it shows up here.</p>';
    else {
      html += row("Earned", money(dd.total)) + row("Days you worked", dd.days + " of " + dd.dim) + row("Deposits logged", String(dd.n))
        + row("Average per day worked", money(dd.avgDay)) + row("Average per deposit", money(dd.avgEntry))
        + row("Per week (average)", dd.perWeek.toFixed(1) + " days") + row("Best day", dd.best ? money(dd.best.amount) + " · " + esc(prettyDate(dd.best.date, {month: "short", day: "numeric"})) : "")
        + (dd.topDayN > 1 ? row("Most common day", esc(dd.topDay) + " (" + dd.topDayN + "×)") : "")
        + (m.incomeIn > 0 ? row("Share of all income", Math.round(dd.total / m.incomeIn * 100) + "%") : "")
        + (dd.toPocket > 0 ? row("Went to pocket money", money(dd.toPocket)) : "");
      if (prev && prev.n) html += `<span class="sub">Last month: ${money(prev.total)} over ${prev.days} ${prev.days === 1 ? "day" : "days"}.</span>`;
    }
    html += `</section>`;
    app.innerHTML = html;
    wireReview(k);
  }
  function wireReview(k){
    const p = document.getElementById("rPrev"), n = document.getElementById("rNext");
    if (p) p.onclick = () => { S.revMonth = shiftMonth(k, -1); render(); };
    if (n) n.onclick = () => { S.revMonth = shiftMonth(k, 1); render(); };
  }

  // ---------------- history ----------------
  function renderHistory(){
    const k = S.histMonth;
    ensureMonth(k);
    const loaded = k in S.months;
    const m = monthStats(k);
    const trail = accountTrail();
    const trl = (id, sav) => { const x = trail[id]; if (!x) return ""; return `<div class="t2">Checking ${money(x.chk[0])} → ${money(x.chk[1])}</div>` + (x.sav ? `<div class="t2">Savings ${money(x.sav[0])} → ${money(x.sav[1])}</div>` : ""); };
    const rows = m.tx.map((t) => ({...t, kind: t.type}));
    for (const g of S.goals){
      // running balance: what the goal held just before and just after each entry
      let run = 0;
      const ord = (g.entries || []).map((e, i) => ({e, i})).sort((a, b) => (a.e.date + (a.e.ts || "")).localeCompare(b.e.date + (b.e.ts || "")) || a.i - b.i);
      const bal = {};
      for (const {e} of ord){ const before = run; run = round2(run + num(e.amount)); bal[e.id] = [before, run]; }
      for (const e of (g.entries || [])) if (e.date.startsWith(k)) rows.push({id: e.id, date: e.date, ts: e.ts, amount: e.amount, kind: "goal", goal: g, note: e.note, edited: (e.edits || []).length > 0, bal: bal[e.id]});
    }
    for (const j of ((S.accounts || {}).adjustments || [])) if (j.date.startsWith(k)) rows.push({id: j.id, date: j.date, ts: j.ts, kind: "adj", adj: j});
    rows.sort((a, b) => (b.date + (b.ts || "")).localeCompare(a.date + (a.ts || "")));
    let html = `
      <div class="headrow"><div class="head"><span class="date">History</span></div>${helpBtn()}</div>
      <div class="monthnav">
        <button type="button" class="iconbtn" id="mPrev" aria-label="Previous month">${IC.l}</button>
        <h1 style="font-size:22px">${esc(monthName(k))}</h1>
        <button type="button" class="iconbtn" id="mNext" aria-label="Next month">${IC.r}</button>
      </div>
      <div class="stats">
        <div class="stat"><span class="l">Paid in</span><span class="v">${money(m.incomeIn, 0)}</span></div>
        <div class="stat"><span class="l">Spent</span><span class="v">${money(m.spendSpent, 0)}</span></div>
        <div class="stat"><span class="l">To goals</span><span class="v">${money(m.saved, 0)}</span></div>
      </div>
      <button type="button" class="pillbtn ghost" data-review="${esc(k)}" style="align-self:flex-start">Month review</button>`;
    if (!loaded) html += '<p class="empty">Loading…</p>';
    else if (!rows.length) html += '<p class="empty">Nothing logged this month yet. Tap the + button to log a purchase or paycheck.</p>';
    else {
      let day = "", open = false;
      for (const t of rows){
        if (t.date !== day){
          if (open) html += "</div>";
          day = t.date;
          html += `<div class="dayhead">${esc(prettyDate(day, {weekday: "long", month: "short", day: "numeric"}))}</div><div class="daycard">`;
          open = true;
        }
        if (t.kind === "adj"){
          const j = t.adj, sg = (x) => (x < 0 ? "−" : "+") + money(Math.abs(x));
          const lines = [j.chk ? `Checking · estimate ${money(j.chk.est)} → actual ${money(j.chk.actual)}` : "", j.sav ? `Savings · estimate ${money(j.sav.est)} → actual ${money(j.sav.actual)}` : ""].filter(Boolean);
          const amt = [j.chk ? sg(j.chk.actual - j.chk.est) : "", j.sav ? sg(j.sav.actual - j.sav.est) : ""].filter(Boolean);
          html += `<div class="txrow" role="group" aria-label="Balance adjustment"><span class="dot" style="--gc:var(--warn)"></span>
            <span style="min-width:0"><div class="t1">Balance adjustment</div>${j.note ? `<div class="t2">${esc(j.note)}</div>` : ""}${lines.map((l) => `<div class="t2">${esc(l)}</div>`).join("")}</span>
            <span class="amt" style="display:flex;flex-direction:column;align-items:flex-end;color:var(--warn)">${amt.map((x) => `<span>${x}</span>`).join("")}</span></div>`;
          continue;
        }
        if (t.kind === "goal"){
          const a = num(t.amount);
          html += `<button type="button" class="txrow" data-edit-entry="${esc(t.id)}" data-goal="${esc(t.goal.id)}" aria-label="Edit ${esc(t.goal.name)} entry"><span class="dot" style="--gc:var(--savings)"></span>
            <span style="min-width:0"><div class="t1">${esc(t.goal.name)}</div><div class="t2">${a < 0 ? "Used" : "Added"}${t.note ? " · " + esc(t.note) : ""}${t.edited ? " · edited" : ""}</div>${t.bal ? `<div class="t2">Goal ${money(t.bal[0])} → ${money(t.bal[1])}</div>` : ""}${trl(t.id)}</span>
            <span class="amt sav">${a < 0 ? "−" : "+"}${money(Math.abs(a))}</span><span class="chev" aria-hidden="true">${IC.r}</span></button>`;
          continue;
        }
        const c = catById(t.categoryId), inc = t.type === "income", src = inc ? incById(t.incomeId) : null;
        const title = inc ? (src ? src.name : "Income") : (c ? c.name : "Deleted category");
        const tagTxt = t.tag === "food" ? "Ate out" : t.tag === "random" ? "Random" : "";
        const second = (inc ? ("Income" + (t.note ? " · " + t.note : "")) : ([tagTxt, t.note].filter(Boolean).join(" · ") || (c ? c.group : ""))) + ((t.edits || []).length ? " · edited" : "");
        html += `<button type="button" class="txrow" data-edit-tx="${esc(t.id)}" data-month="${esc(k)}" aria-label="Edit ${esc(title)} ${money(Math.abs(num(t.amount)))}">
          <span class="dot" style="--gc:${inc ? "var(--ok)" : c ? GC[c.group] || "var(--muted)" : "var(--muted)"}"></span>
          <span style="min-width:0"><div class="t1">${esc(title)}</div><div class="t2">${esc(second)}</div>${trl(t.id)}</span>
          <span class="amt ${inc ? "inc" : ""}">${inc ? "+" : "−"}${money(Math.abs(num(t.amount)))}</span>
          <span class="chev" aria-hidden="true">${IC.r}</span>
        </button>`;
      }
      if (open) html += "</div>";
      html += '<p class="foot">Tap any entry to edit or delete it</p>';
    }
    app.innerHTML = html;
    document.getElementById("mPrev").onclick = () => { S.histMonth = shiftMonth(S.histMonth, -1); S.armed = null; render(); };
    document.getElementById("mNext").onclick = () => { S.histMonth = shiftMonth(S.histMonth, 1); S.armed = null; render(); };
  }

  // ---------------- plan ----------------
  let draft = null, saveTimer = null;
  function planSummaryHTML(){
    const p = draft;
    const inc = expectedMonthly(p.income);
    const g = {Needs: 0, Wants: 0};
    p.categories.forEach((c) => { if (g[c.group] !== undefined) g[c.group] += num(c.budget); });
    const gm = goalsMonthly();
    const lta = round2(inc - g.Needs - g.Wants - gm);
    const st = Math.abs(lta) < 1 ? ["ok", "Balanced"] : lta > 0 ? ["under", "Unassigned"] : ["over", "Over budget"];
    const pc = (v) => inc ? " · " + Math.round((v / inc) * 100) + "%" : "";
    return `<div class="sumtop"><span class="sub" style="font-size:14px">Left to assign each month</span><span class="big" style="color:var(--fg)">${money(lta)}</span><span class="status ${st[0]}">${st[1]}</span></div>
      <div class="sumlines">
        <div><span>Expected income</span><b>${money(inc)}</b></div>
        <div><span><span class="dot" style="--gc:var(--needs)"></span>Needs${pc(g.Needs)}</span><span>−${money(g.Needs)}</span></div>
        <div><span><span class="dot" style="--gc:var(--wants)"></span>Wants${pc(g.Wants)}</span><span>−${money(g.Wants)}</span></div>
        <div><span><span class="dot" style="--gc:var(--savings)"></span>Goals${pc(gm)}</span><span>−${money(gm)}</span></div>
      </div>`;
  }
  function renderPlan(){
    if (S.status === "loading"){ draft = null; app.innerHTML = '<div class="head"><span class="date">Plan</span><h1>Monthly plan</h1></div><p class="empty">Loading your plan…</p>'; return; }
    draft = JSON.parse(JSON.stringify({...plan(), income: incomes(), categories: plan().categories || []}));
    app.innerHTML = `
      <div class="headrow"><div class="head"><span class="date" id="saveState">${S.status === "offline" ? "Not saving in this view" : "Changes save automatically"}</span><h1>Monthly plan</h1></div>${helpBtn()}</div>
      <section class="card" id="planSum" aria-label="Plan summary">${planSummaryHTML()}</section>
      <div class="sechead"><h2>Income</h2><span>take-home pay</span></div>
      <section class="pcard" aria-label="Income">
        <div id="incList">${draft.income.map(incRow).join("")}</div>
        <button type="button" class="addbtn" id="addInc">+ Add income source</button>
      </section>
      <div class="sechead"><h2>Spending categories</h2><span>monthly budget</span></div>
      <section class="pcard" aria-label="Categories">
        <div id="catList">${draft.categories.filter((c) => c.group !== "Savings").map(catRow).join("")}</div>

      <div class="sechead"><h2>Safety cushion</h2><span>forecast</span></div>
      <section class="pcard" aria-label="Safety cushion"><div class="prow"><div class="r"><label class="hint" for="cushion" style="flex:1">Never let Free to spend dip your projected checking below this, in case a paycheck comes in short or late.</label><input class="field num" id="cushion" inputmode="decimal" style="width:100px;flex:none" value="${draft.cushion != null ? num(draft.cushion) : 25}"></div></div></section>
      <div class="sechead"><h2>Overspending</h2><span>pocket money</span></div>
      <section class="pcard" aria-label="Overspending"><div class="prow"><label style="display:flex;gap:12px;align-items:center;font-size:14px;min-height:44px"><input type="checkbox" id="coverOver" ${draft.coverOver !== false ? "checked" : ""} style="width:22px;height:22px;flex:none;accent-color:var(--accent)"> When I go over on gas, essentials, or a bill, take the extra out of my pocket money</label></div></section>
      <p class="foot">Goal: get Left to assign to $0</p>`;
    document.getElementById("addInc").onclick = () => { const r = {id: uid(), name: "", kind: "fixed", freq: "monthly", amount: 0}; draft.income.push(r); document.getElementById("incList").insertAdjacentHTML("beforeend", incRow(r)); focusLast("#incList"); queueSave(); };
    document.getElementById("addCat").onclick = () => { const r = {id: uid(), name: "", group: "Wants", budget: 0}; draft.categories.push(r); document.getElementById("catList").insertAdjacentHTML("beforeend", catRow(r)); focusLast("#catList"); queueSave(); };
  }
  const ord = (n) => n + (n % 10 === 1 && n !== 11 ? "st" : n % 10 === 2 && n !== 12 ? "nd" : n % 10 === 3 && n !== 13 ? "rd" : "th");
  function subsBoxHTML(){
    const list = [...S.subsList].sort((a, b) => (parseInt(a.dueDay, 10) || 99) - (parseInt(b.dueDay, 10) || 99));
    const total = list.reduce((s, x) => s + num(x.price), 0);
    const cat = cats().find((c) => isSubsCat(c));
    const missing = list.filter((x) => !(num(x.price) > 0)).length;
    const gym = cats().find((c) => /gym/i.test(c.name || "") && roleOf(c) === "bill");
    return `${list.map((x) => `<button type="button" class="txrow" data-sub-edit="${esc(x.id)}" style="grid-template-columns:minmax(0,1fr) auto auto"><span style="min-width:0"><div class="t1">${esc(x.name)}</div><div class="t2">${parseInt(x.dueDay, 10) ? "Due the " + ord(parseInt(x.dueDay, 10)) + " each month" : "No due day yet"}</div></span><span class="amt" style="${num(x.price) > 0 ? "" : "color:var(--warn)"}">${num(x.price) > 0 ? money(num(x.price)) : "Add price"}</span><span class="chev" aria-hidden="true">${IC.r}</span></button>`).join("") || '<p class="empty">No subscriptions yet.</p>'}
      ${gym ? `<p class="hint" style="margin:6px 0 0">${esc(gym.name)} (${money(num(gym.budget))}${parseInt(gym.dueDay, 10) ? ", the " + ord(parseInt(gym.dueDay, 10)) : ""}) is tracked as its own bill in Plan.</p>` : ""}
      <div class="srcrow" style="margin-top:6px"><span class="muted">Total per month</span><b>${money(total)}</b></div>
      ${cat && Math.abs(total - num(cat.budget)) > 0.5 && !missing ? `<div class="notice soft" style="margin-top:6px"><span>Your Subscriptions budget is ${money(num(cat.budget))}, but this list adds up to ${money(total)}.</span><button type="button" data-sub-match>Match</button></div>` : ""}
      ${missing ? `<p class="hint" style="margin:6px 0 0;color:var(--warn)">${missing} without a price. Until you add it, the forecast estimates it from your ${money(cat ? num(cat.budget) : 0)} Subscriptions budget.</p>` : ""}
      <button type="button" class="addbtn" data-sub-add>+ Add subscription</button>`;
  }
  async function saveSubs(){

  function openSubEdit(x){
    const isNew = !x, d = x || {name: "", price: "", dueDay: ""};
    const {close, el} = sheet(isNew ? "Add subscription" : "Edit subscription", `
      <div><label class="lab" for="sname">Name</label><input class="field" id="sname" value="${esc(d.name)}" placeholder="e.g. Spotify" autocomplete="off"></div>
      <div class="row2">

        S.subsList = S.subsList.filter((s) => s.id !== x.id); saveSubs(); close(); toast("Deleted");
      };
    }
    if (isNew) setTimeout(() => el.querySelector("#sname").focus(), 50);
  }
  function focusLast(sel){ const ins = document.querySelectorAll(sel + " .prow:last-child input"); if (ins[0]) ins[0].focus(); }

      <div class="r">

        <input class="field num" id="ia-${esc(r.id)}" aria-label="${r.kind === "varies" ? "Typical paycheck" : "Amount each time"}" inputmode="decimal" placeholder="$0" value="${num(r.amount) ? num(r.amount) : ""}" data-f="amount">

    </div>`;

  function refreshPlanSummary(){ const el = document.getElementById("planSum"); if (el) el.innerHTML = planSummaryHTML(); }
  function queueSave(){
    refreshPlanSummary();
    const ss = document.getElementById("saveState");

  async function savePlan(){
    const body = JSON.parse(JSON.stringify(draft));
    body.example = false;
    body.income = body.income.map((i) => ({...i, amount: round2(num(i.amount))}));
    body.categories = body.categories.map((c) => { const o = {...c, budget: round2(num(c.budget))}; const dd = parseInt(c.dueDay, 10); if (dd >= 1 && dd <= 31) o.dueDay = dd; else delete o.dueDay; return o; });

  // ---------------- guide ----------------

        <div class="rule"><span class="dot" style="--gc:var(--warn)"></span><p>Bars turn <b style="color:var(--warn)">yellow</b> at 90% of a budget and <b style="color:var(--red)">red</b> when you're over.</p></div>

  async function toggleStep(k){
    const done = {...(S.guide.done || {}), [k]: !(S.guide.done || {})[k]};
    S.guide = {...S.guide, done};
    render();
    if (S.db) try { await S.db.doc("config/guide").set(S.guide); } catch (e){ toast("Couldn't save that checkmark."); }

  // ---------------- sheets ----------------
  function sheet(title, body){
    root.innerHTML = `<div class="scrim" id="scrim"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
      <span class="grab" aria-hidden="true"></span>
      <div class="sheettop"><h2 id="sheetTitle">${title}</h2><button type="button" class="iconbtn" data-close aria-label="Close">${IC.x}</button></div>${body}</div></div>`;
    const close = () => { root.innerHTML = ""; };
    root.querySelector("[data-close]").onclick = close;
    document.getElementById("scrim").addEventListener("click", (e) => { if (e.target.id === "scrim") close(); });
    root.querySelector(".sheet").addEventListener("keydown", (e) => { if (e.key === "Escape") close(); });
    return {close, el: root.querySelector(".sheet")};
  }

  // ----- change history for edited entries -----
  const txSnap = (t) => ({date: t.date, amount: num(t.amount), type: t.type, categoryId: t.categoryId || null, incomeId: t.incomeId || null, note: t.note || "", tag: t.tag || null, pocket: num(t.pocket) || 0});
  function describeTx(s){
    const c = catById(s.categoryId), src = incById(s.incomeId);
    return [
      ["Amount", money(num(s.amount))],
      ["Type", s.type === "income" ? "Income" : "Expense"],
      [s.type === "income" ? "Paid by" : "Category", s.type === "income" ? (src ? src.name : "Other") : (c ? c.name : "Deleted category")],
      ...(s.tag ? [["Kind", s.tag === "food" ? "Ate out" : "Random"]] : []),
      ...(s.pocket ? [["To pocket money", money(num(s.pocket))]] : []),
      ["Date", prettyDate(s.date, {month: "short", day: "numeric", year: "numeric"})],
      ["Note", s.note || "—"],
    ];
  }
  const entrySnap = (e) => ({amount: num(e.amount), date: e.date, note: e.note || "", starting: !!e.starting});
  const describeEntry = (s) => [["Type", s.amount < 0 ? "Used" : "Added"], ["Amount", money(Math.abs(s.amount))], ["Date", prettyDate(s.date, {month: "short", day: "numeric", year: "numeric"})], ["Note", s.note || "—"], ["Starting balance", s.starting ? "Yes" : "No"]];
  function changeHistoryHTML(edits, current, describe){
    const versions = [...edits.map((e) => e.before), current];
    const blocks = edits.map((e, i) => {
      const b = describe(versions[i]), a = describe(versions[i + 1]);
      const rows = b.map(([k, v], j) => { const av = (a.find(([ak]) => ak === k) || [k, "—"])[1]; const diff = av !== v; return `<div class="chrow${diff ? " diff" : ""}"><span>${esc(k)}</span><span>${esc(v)}</span><span>${diff ? "→ " + esc(av) : ""}</span></div>`; }).join("");
      const when = new Date(e.at).toLocaleString("en-US", {month: "short", day: "numeric", hour: "numeric", minute: "2-digit"});
      return `<div class="chblock"><div class="chwhen">Changed ${esc(when)}</div><div class="chrow chhead"><span></span><span>Before</span><span>After</span></div>${rows}</div>`;
    }).reverse().join("");
    return `<details class="gd" style="padding:0 14px"><summary style="font-size:15px;min-height:50px">Change history (${edits.length})</summary><div class="gbody" style="gap:14px">${blocks}</div></details>`;
  }

  function openLog(preCat, ex){
    const today = ymd(new Date());
    const st = ex ? {type: ex.type, cat: ex.categoryId || null, src: ex.type === "income" ? (ex.incomeId || "other") : null, tag: ex.tag || "random"} : {type: "expense", cat: preCat || null, src: null, tag: "random"};
    const isFun = () => { const c = catById(st.cat); return st.type === "expense" && c && roleOf(c) === "fun"; };
    const catChips = GROUPS.map((g) => {
      const list = cats().filter((c) => c.group === g && c.name);
      if (!list.length) return "";
      return `<div><div class="chiphead">${g}</div><div class="chips">${list.map((c) => `<button type="button" class="chip" data-chip="${esc(c.id)}" aria-pressed="false" style="--gc:${GC[g]}">${esc(c.name)}</button>`).join("")}</div></div>`;
    }).join("") || '<p class="empty">No categories yet. Add some in Plan.</p>';
    const srcChips = `<div><div class="chiphead">Paid by</div><div class="chips">${incomes().map((i) => `<button type="button" class="chip" data-src="${esc(i.id)}" aria-pressed="false" style="--gc:var(--ok)">${esc(i.name || "Income")}</button>`).join("")}<button type="button" class="chip" data-src="other" aria-pressed="false" style="--gc:var(--muted)">Other</button></div></div>`;
    const {close, el} = sheet(ex ? "Edit transaction" : "Log transaction", `
      <div class="typetog" role="group" aria-label="Type"><button type="button" data-type="expense" aria-pressed="true">Expense</button><button type="button" data-type="income" aria-pressed="false">Income</button></div>
      <div><label class="lab" for="amt">Amount</label><div class="amountwrap"><span>$</span><input class="amount" id="amt" inputmode="decimal" autocomplete="off" placeholder="0.00" value="${ex ? num(ex.amount) : ""}"></div></div>
      <div id="paceWarn" class="paceWarn" hidden role="status"></div>
      <div class="pick" id="catPick">${catChips}</div>
      <div id="tagPick" hidden><div class="chiphead">What was it?</div><div class="typetog" role="group" aria-label="Kind of pocket money purchase"><button type="button" data-tag="food">Ate out</button><button type="button" data-tag="random">Random</button></div></div>
      <div class="pick" id="srcPick" hidden>${srcChips}<p class="hint" style="margin:0">Log take-home pay: the amount that hit your bank.</p></div>
      <div id="pocketPick" hidden><div class="chiphead">Add to pocket money this month</div>
        <div class="row2"><div class="chips"><button type="button" class="chip" data-pk="all" aria-pressed="false" style="--gc:var(--accent)">All</button><button type="button" class="chip" data-pk="70" aria-pressed="false" style="--gc:var(--accent)">70%</button><button type="button" class="chip" data-pk="0" aria-pressed="false" style="--gc:var(--muted)">None</button></div>
          <input class="field num" id="pocketAmt" inputmode="decimal" autocomplete="off" aria-label="Amount to add to pocket money" placeholder="$0"></div>
        <p class="hint" style="margin:8px 0 0">Raises Free to spend right away. Counts for this month only, so your plan doesn't change. Notes that say DoorDash fill this in for you.</p></div>
      <div class="row2">
        <div><label class="lab" for="note">Note</label><input class="field" id="note" placeholder="Optional" autocomplete="off" value="${ex ? esc(ex.note || "") : ""}"></div>
        <div><label class="lab" for="date">Date</label><input class="field" id="date" type="date" value="${ex ? esc(ex.date) : today}"></div>
      </div>
      <button type="button" class="save" id="saveTx" disabled>Save</button>
      ${ex ? '<button type="button" class="dangerbtn" id="delTx">Delete transaction</button>' : ""}
      ${ex && (ex.edits || []).length ? changeHistoryHTML(ex.edits, txSnap(ex), describeTx) : ""}`);
    const amt = el.querySelector("#amt"), saveBtn = el.querySelector("#saveTx");
    const noteEl = el.querySelector("#note"), pk = el.querySelector("#pocketAmt");
    st.pkTouched = !!ex;
    if (ex && ex.pocket) pk.value = num(ex.pocket);
    const autoPk = () => {
      if (st.pkTouched) return;
      const a = round2(num(amt.value));
      pk.value = (st.type === "income" && st.src === "other" && /door\s*dash/i.test(noteEl.value) && a > 0) ? a : "";
    };
    const valid = () => num(amt.value) > 0 && (st.type === "income" ? !!st.src : !!st.cat);
    const sync = () => {
      autoPk();
      const showPk = st.type === "income" && st.src === "other";
      const a = round2(num(amt.value)), pv = Math.min(round2(num(pk.value)), a || Infinity);
      el.querySelector("#pocketPick").hidden = !showPk;
      el.querySelectorAll("[data-pk]").forEach((b) => b.setAttribute("aria-pressed", String(a > 0 && (b.dataset.pk === "all" ? pv === a : b.dataset.pk === "70" ? pv === round2(a * 0.7) : pv <= 0))));
      const allToPocket = showPk && a > 0 && pv >= a;
      saveBtn.disabled = !valid();
      saveBtn.textContent = ex ? "Save changes" : allToPocket ? "Save to pocket money" : st.type === "income" ? "Save and plan it" : "Save";
      const pw = el.querySelector("#paceWarn"); let wv = null;
      if (!ex && isFun() && a > 0 && !/^\d{4}-\d\d-\d\d$/.test("") ){
        const mm = monthStats(monthKey(new Date())), fcN = freshFc(), pp = pocketNow(mm, fcN);
        if (pp){ wv = pocketVerdict2(pp, fcN, a); if (wv && wv.t === "ok") wv = null; }
      }
      pw.hidden = !wv;
      if (wv){ pw.className = "paceWarn " + wv.t; pw.innerHTML = "<b>" + esc(wv.h) + ".</b> " + wv.p; if (wv.t === "bad") saveBtn.textContent = "Save anyway"; }
      el.querySelectorAll("[data-type]").forEach((b) => b.setAttribute("aria-pressed", b.dataset.type === st.type));
      el.querySelector("#catPick").hidden = st.type === "income";
      el.querySelector("#srcPick").hidden = st.type !== "income";
      el.querySelectorAll("[data-chip]").forEach((b) => b.setAttribute("aria-pressed", b.dataset.chip === st.cat));
      el.querySelectorAll("[data-src]").forEach((b) => b.setAttribute("aria-pressed", b.dataset.src === st.src));
      el.querySelector("#tagPick").hidden = !isFun();
      el.querySelectorAll("[data-tag]").forEach((b) => b.setAttribute("aria-pressed", b.dataset.tag === st.tag));
    };
    el.querySelectorAll("[data-tag]").forEach((b) => b.onclick = () => { st.tag = b.dataset.tag; sync(); });
    amt.addEventListener("input", sync);
    noteEl.addEventListener("input", sync);
    pk.addEventListener("input", () => { st.pkTouched = true; sync(); });
    el.querySelectorAll("[data-pk]").forEach((b) => b.onclick = () => {
      const a = round2(num(amt.value)); st.pkTouched = true;
      pk.value = b.dataset.pk === "all" ? (a || "") : b.dataset.pk === "70" ? (a ? round2(a * 0.7) : "") : "";
      sync();
    });
    el.querySelectorAll("[data-type]").forEach((b) => b.onclick = () => { st.type = b.dataset.type; sync(); });
    el.querySelectorAll("[data-chip]").forEach((b) => b.onclick = () => { st.cat = b.dataset.chip; sync(); });
    el.querySelectorAll("[data-src]").forEach((b) => b.onclick = () => { st.src = b.dataset.src; sync(); });
    saveBtn.onclick = async () => {
      if (!valid()) return;
      const inc = st.type === "income";
      const t = {id: ex ? ex.id : uid(), date: el.querySelector("#date").value || today, amount: round2(num(amt.value)), type: st.type, categoryId: inc ? null : st.cat, incomeId: inc && st.src !== "other" ? st.src : null, note: el.querySelector("#note").value.trim(), ts: ex ? (ex.ts || new Date().toISOString()) : new Date().toISOString()};
      if (isFun()) t.tag = st.tag;
      if (inc && st.src === "other"){ const pv = Math.min(round2(num(pk.value)), t.amount); if (pv > 0) t.pocket = pv; }
      saveBtn.disabled = true; saveBtn.textContent = "Saving…";
      if (ex){
        const before = txSnap(ex), after = txSnap(t);
        const changed = JSON.stringify(before) !== JSON.stringify(after);
        t.edits = [...(ex.edits || [])];
        if (changed) t.edits.push({at: new Date().toISOString(), before});
        if (!changed){ close(); toast("No changes"); return; }
        if (await replaceTx(ex, t)){ close(); toast("Changes saved"); } else sync();
        return;
      }
      if (await addTx(t)){
        close();
        if (inc && window.__cel) window.__cel({kind: "income", amount: t.amount});
        if (inc){
          const rest = round2(t.amount - (t.pocket || 0));
          if (t.pocket && rest <= 0.004) toast("Logged " + money(t.amount) + " · added to pocket money");
          else openSplit(t.pocket ? {...t, amount: rest} : t);
        }
        else { const c = catById(t.categoryId); toast("Logged " + money(t.amount) + " · " + (inc ? "Income" : t.tag === "food" ? "Ate out" : c ? c.name : "")); }
      } else sync();
    };
    if (ex){
      const del = el.querySelector("#delTx");
      del.onclick = async () => {
        if (!del.classList.contains("armed")){ del.classList.add("armed"); del.textContent = "Tap again to delete"; return; }
        del.disabled = true;
        await deleteTx(ex.date.slice(0, 7), ex.id);
        close();
      };
    }
    sync();
    if (!ex) setTimeout(() => amt.focus(), 50);
  }

  // Paycheck plan: bills before the next payday and needs come first, then goals (paced against the month), then pocket money.
  function paycheckPlan(t){
    const D = parseD(t.date), A = num(t.amount), k = t.date.slice(0, 7);
    let next = null;
    for (const i of incomes()){
      if (num(i.amount) <= 0) continue;
      const np = nextPay(i); if (!np) continue;
      let d = np.d, g = 0; while (d <= D && g++ < 60) d = stepPay(d, i.freq);
      if (!next || d < next) next = d;
    }
    const endM = new Date(D.getFullYear(), D.getMonth() + 1, 1);
    const until = next || endM;
    const days = Math.max(1, Math.min(31, Math.round((until - D) / 864e5)));
    const bills = billEvents(D, days).ev;
    const billsAmt = round2(bills.reduce((s, e) => s - e.amt, 0));
    const m = monthStats(k);
    const needCats = cats().filter((c) => roleOf(c) === "regular" && c.group === "Needs");
    const needLeft = needCats.reduce((s, c) => s + Math.max(0, num(c.budget) - (m.spent[c.id] || 0)), 0);
    const dimD = dimOf(D.getFullYear(), D.getMonth()), daysLeftD = dimD - D.getDate() + 1;
    const needsAmt = round2(daysLeftD ? needLeft / daysLeftD * days : 0);
    const exp = expectedMonthly() || A, frac = D.getDate() / dimD;
    const goals = S.goals.map((g) => {
      const monthly = num(g.monthly), added = goalAddedIn(g, k), pace = monthly * frac;
      const toTarget = num(g.target) > 0 ? Math.max(0, num(g.target) - goalBalance(g)) : Infinity;
      const share = A * (monthly / exp);
      let v = 0, status = "info", note = "";
      if (monthly <= 0){ note = "No monthly amount set. Add one on Goals to include it."; }
      else if (toTarget <= 0){ status = "ok"; note = "Goal reached. Nothing needed."; }
      else if (added >= monthly){ status = "ok"; note = `Ahead: this month's ${money(monthly, 0)} is already in. Anything extra gets you there sooner.`; }
      else {
        const behind = pace - added;
        const catchUp = Math.max(0, behind - share);
        v = Math.min(monthly - added, share + catchUp, toTarget);
        if (behind > 1){ status = "warn"; note = `Behind pace by ${money(behind, 0)} for this point in the month. Suggested amount ${catchUp > 0 ? "includes a catch-up" : "keeps you on track"}.`; }
        else { status = "ok"; note = `On pace (${money(added, 0)} of ${money(monthly, 0)} this month).`; }
      }
      return {g, v: Math.max(0, Math.round(v)), status, note};
    });
    let room = A - billsAmt - needsAmt, want = goals.reduce((s, x) => s + x.v, 0), trimmed = false;
    if (want > Math.max(0, room) && want > 0){ const f = Math.max(0, room) / want; goals.forEach((x) => { x.v = Math.floor(x.v * f); }); trimmed = true; }
    return {A, until, next: !!next, days, bills, billsAmt, needsAmt, needNames: needCats.map((c) => c.name), goals, trimmed};
  }

    const {close, el} = sheet("Plan this paycheck", `
      <p class="sub" style="margin:0;font-size:14px">${money(P.A)} from ${esc(src ? src.name : "income")}. It needs to carry you ${P.next ? "until your next payday, " + esc(dlong) : "to the end of the month"} (${P.days} days).</p>
      <div class="totals">
        <div><span class="muted">Bills due before then</span><b>−${money(P.billsAmt)}</b></div>

        <div><span class="muted">${esc(P.needNames.join(" & ") || "Needs")} for ${P.days} days</span><b>−${money(P.needsAmt)}</b></div>

      <div>${P.goals.map(({g, v, status, note}) => `<div class="splitrow" style="align-items:start"><div style="min-width:0"><div class="t1">${esc(g.name)}</div><div style="margin:4px 0"><span class="chipline ${chip(status)}">${status === "warn" ? "Behind" : status === "ok" ? (note.startsWith("Ahead") ? "Ahead" : note.startsWith("Goal") ? "Done" : "On pace") : "Not set"}</span></div><div class="t2" style="white-space:normal">${esc(note)}</div></div>
        <input class="field num" inputmode="decimal" aria-label="Amount to ${esc(g.name)}" data-split="${esc(g.id)}" value="${v || ""}" placeholder="$0"></div>`).join("") || '<p class="empty">No goals yet.</p>'}</div>
      ${P.trimmed ? '<p class="hint" style="margin:0;color:var(--warn)">Goal suggestions were trimmed so bills and gas come first from this check.</p>' : ""}

      <button type="button" class="save" id="saveSplit">Save plan</button>
      <button type="button" class="linkbtn" id="skipSplit">Skip, don't send anything to goals</button>`);
    const ins = [...el.querySelectorAll("[data-split]")];
    const sync = () => {
      const tot = ins.reduce((s, i) => s + num(i.value), 0);
      el.querySelector("#toGoals").textContent = money(tot);
      const left = P.A - P.billsAmt - P.needsAmt - tot;
      const ts = el.querySelector("#toSpend"); ts.textContent = money(left); ts.style.color = left < 0 ? "var(--red)" : "var(--ok)";
      el.querySelector("#saveSplit").disabled = P.A - tot < -0.005;
    };
    ins.forEach((i) => i.addEventListener("input", sync));
    el.querySelector("#skipSplit").onclick = () => { close(); toast("Logged " + money(t.amount) + " · Income"); };
    el.querySelector("#saveSplit").onclick = async () => {
      const btn = el.querySelector("#saveSplit"); btn.disabled = true; btn.textContent = "Saving…";
      let ok = true, total = 0;

  // ---------------- backup ----------------
  async function exportBackup(){
    if (!S.db || !S.db.exportAll) return;
    try {
      const docs = await S.db.exportAll();
      const now = new Date();
      const body = JSON.stringify({app: "mission-budget", version: 1, exportedAt: now.toISOString(), docs}, null, 1);
      const name = "mission-budget-backup-" + ymd(now) + ".json";
      const file = new File([body], name, {type: "application/json"});
      let shared = false;
      if (navigator.canShare && navigator.canShare({files: [file]})){
        try { await navigator.share({files: [file], title: name}); shared = true; }
        catch (e){ if (e && e.name === "AbortError") return; }
      }
      if (!shared){
        const url = URL.createObjectURL(file), a = document.createElement("a");
        a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 4000);
      }
      S.lastBackup = now.toISOString();
      await S.db.setMeta("lastBackup", S.lastBackup);
      toast("Backup saved"); render();
    } catch (e){ toast("Backup failed. Try again."); }
  }
  function pickRestore(){
    const inp = document.createElement("input");
    inp.type = "file"; inp.accept = ".json,application/json";
    inp.onchange = async () => {
      const f = inp.files && inp.files[0]; if (!f) return;
      let data;
      try { data = JSON.parse(await f.text()); } catch (e){ toast("That file isn't a Rosewood backup."); return; }
      if (!data || data.app !== "mission-budget" || typeof data.docs !== "object"){ toast("That file isn't a Rosewood backup."); return; }
      const when = data.exportedAt ? new Date(data.exportedAt).toLocaleString("en-US", {month: "short", day: "numeric", year: "numeric", hour: "numeric", minute: "2-digit"}) : "unknown date";
      if (!S.empty && !confirm("Replace everything in the app with the backup from " + when + "? This can't be undone.")) return;
      try {
        try { await S.db.snapshot("Before a restore"); } catch (e){}
        await S.db.importAll(data.docs);
        await S.db.setMeta("lastBackup", new Date().toISOString());
        location.reload();
      } catch (e){ toast("Restore failed: " + ((e && (e.name || e.message)) || "unknown") + (e && e.message && e.name ? " – " + String(e.message).slice(0, 80) : "")); }
    };
    inp.click();
  }

  // ---------------- data ----------------
  async function loadMonth(k){
    if (k in S.months) return S.months[k];
    if (!S.db){ S.months[k] = []; return []; }
    const snap = await S.db.doc("months/" + k).get();
    S.months[k] = snap.exists ? [...((snap.data() || {}).tx || [])] : [];
    return S.months[k];
  }
  async function addTx(t){
    const k = t.date.slice(0, 7);
    try {
      const list = [...(await loadMonth(k)), t];
      S.months[k] = list;
      if (S.db) await S.db.doc("months/" + k).set({tx: list});
      render();
      return true;
    } catch (e){ toast("Couldn't save that. Check your connection and try again."); return false; }
  }
  async function replaceTx(old, t){
    const ko = old.date.slice(0, 7), kn = t.date.slice(0, 7);
    try {
      if (ko === kn){
        const list = (await loadMonth(ko)).map((x) => x.id === old.id ? t : x);
        S.months[ko] = list;
        if (S.db) await S.db.doc("months/" + ko).set({tx: list});
      } else {
        const a = (await loadMonth(ko)).filter((x) => x.id !== old.id);
        const b = [...(await loadMonth(kn)), t];
        S.months[ko] = a; S.months[kn] = b;
        if (S.db){ await S.db.doc("months/" + kn).set({tx: b}); await S.db.doc("months/" + ko).set({tx: a}); }
      }
      render(); return true;
    } catch (e){ toast("Couldn't save the change. Try again."); return false; }
  }
  async function deleteTx(k, id){
    try {
      const prev = (await loadMonth(k)).find((t) => t.id === id);
      const list = (await loadMonth(k)).filter((t) => t.id !== id);
      S.months[k] = list;
      if (S.db) await S.db.doc("months/" + k).set({tx: list});
      S.armed = null; render();
      if (isPro() && prev) toast("Deleted", {label: "Undo", fn: async () => { if (await addTx(prev)) toast("Restored"); }});
      else toast("Deleted");
    } catch (e){ toast("Couldn't delete that. Try again."); }
  }
  async function saveGoal(id, body){
    const i = S.goals.findIndex((x) => x.id === id);
    const local = {...body, id};
    if (i >= 0) S.goals[i] = local; else S.goals.push(local);
    sortGoals(); render();
    if (!S.db) return true;
    try { await S.db.doc("goals/" + id).set(body); return true; }
    catch (e){ toast("Couldn't save the goal. Check your connection and try again."); return false; }
  }
  async function addGoalEntry(g, entry){
    const cur = S.goals.find((x) => x.id === g.id) || g;
    const body = {...cur, entries: [...(cur.entries || []), entry]};
    const id = body.id; delete body.id;
    return saveGoal(id, body);
  }
  function sortGoals(){ S.goals.sort((a, b) => String(a.created || "").localeCompare(String(b.created || "")) || String(a.name).localeCompare(String(b.name))); }
  function ensureMonth(k){
    if (S.subs[k] || !S.db){ if (!S.db && !(k in S.months)) S.months[k] = []; return; }
    const keep = new Set([monthKey(new Date()), k]);
    for (const key of Object.keys(S.subs)) if (!keep.has(key)){ S.subs[key](); delete S.subs[key]; }
    S.subs[k] = S.db.doc("months/" + k).onSnapshot((snap) => {
      S.months[k] = snap.exists ? [...((snap.data() || {}).tx || [])] : [];
      if (S.tab !== "plan") render();
    }, () => { delete S.subs[k]; });
  }

  // ---------------- events ----------------
  document.querySelectorAll(".tab").forEach((b) => b.onclick = () => { S.tab = b.dataset.tab; S.armed = null; render(); window.scrollTo(0, 0); });
  document.getElementById("fab").onclick = () => openLog(null);
  app.addEventListener("click", (e) => {
    const t = (s) => e.target.closest(s);
    let el;
    if ((el = t("[data-theme-set]"))){ setTheme(el.dataset.themeSet); return; }
    if ((el = t("[data-backup]"))){ exportBackup(); return; }
    if ((el = t("[data-paper-save]"))){
      const v = ((document.getElementById("paperUrl") || {}).value || "").trim();
      if (!/^https:\/\/script\.google(usercontent)?\.com\//.test(v)){ toast("That doesn't look like a paper link. It starts with https://script.google.com/"); return; }
      try { localStorage.setItem("fd_paper", v); } catch (e){ toast("Couldn't save the link on this phone."); return; }
      paperSig = ""; paperSend(true); render(); return;
    }
    if ((el = t("[data-dash-log]"))){ openDashLog(); return; }
    if ((el = t("[data-dash-gas]"))){ openDashGas(); return; }
    if ((el = t("[data-dash-del]"))){ dashDelete(el.dataset.dashDel); return; }
    if ((el = t("[data-dash-cover]"))){ openDashCover(el.dataset.dashCover); return; }
    if ((el = t("[data-paper-send]"))){ paperSig = ""; paperSend(true); return; }
    if ((el = t("[data-paper-x]"))){ try { localStorage.removeItem("fd_paper"); localStorage.removeItem("fd_paper_at"); } catch (e){} toast("Morning paper unlinked"); render(); return; }
    if ((el = t("[data-restore]"))){ pickRestore(); return; }
    if ((el = t("[data-weekly]"))){
      const x = (S.weekly || [])[Number(el.dataset.weekly)]; if (!x) return;
      if (!confirm("Replace everything in the app with the weekly copy from " + new Date(x.at).toLocaleString("en-US", {month: "short", day: "numeric", hour: "numeric", minute: "2-digit"}) + "? Your current data is saved as a safety copy first.")) return;
      (async () => { try { await S.db.snapshot("Before using a weekly copy"); await S.db.importAll(JSON.parse(x.body)); location.reload(); } catch (e){ toast("Restore failed: " + ((e && e.name) || "unknown")); } })();
      return;
    }
    if ((el = t("[data-weekly-save]"))){
      const x = (S.weekly || [])[Number(el.dataset.weeklySave)]; if (!x) return;
      (async () => {
        const name = "mission-budget-backup-" + x.at.slice(0, 10) + ".json", body = JSON.stringify({app: "mission-budget", version: 1, exportedAt: x.at, docs: JSON.parse(x.body)}, null, 1), file = new File([body], name, {type: "application/json"});
        try { if (navigator.canShare && navigator.canShare({files: [file]})){ await navigator.share({files: [file], title: name}); return; } } catch (e){ if (e && e.name === "AbortError") return; }
        const url = URL.createObjectURL(file), a = document.createElement("a"); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 4000);
      })();
      return;
    }
    if ((el = t("[data-snap]"))){
      const x = (S.snaps || [])[Number(el.dataset.snap)]; if (!x) return;
      if (!confirm("Replace everything in the app with this safety copy from " + new Date(x.at).toLocaleString("en-US", {month: "short", day: "numeric", hour: "numeric", minute: "2-digit"}) + "?")) return;
      (async () => { try { await S.db.snapshot("Before using a safety copy"); await S.db.importAll(JSON.parse(x.body)); location.reload(); } catch (e){ toast("Restore failed: " + ((e && e.name) || "unknown")); } })();
      return;
    }
    if ((el = t("[data-review]"))){ S.revMonth = el.dataset.review; S.tab = "review"; render(); window.scrollTo(0, 0); return; }
    if ((el = t("[data-go]"))){ S.tab = el.dataset.go; render(); window.scrollTo(0, 0); return; }
    if ((el = t("[data-log]"))){ openLog(el.dataset.log); return; }
    if ((el = t("[data-step]"))){ toggleStep(el.dataset.step); return; }
    if ((el = t("[data-accounts]"))){ openAccounts(); return; }
    if ((el = t("[data-bills]"))){ openBills(); return; }
    if ((el = t("[data-sub-add]"))){ openSubEdit(null); return; }
    if ((el = t("[data-sub-edit]"))){ openSubEdit(S.subsList.find((s) => s.id === el.dataset.subEdit)); return; }
    if ((el = t("[data-sub-match]"))){
      const total = round2(S.subsList.reduce((s, x) => s + num(x.price), 0));
      const body = JSON.parse(JSON.stringify(plan()));
      const c = (body.categories || []).find((x) => isSubsCat(x)); if (!c) return;
      c.budget = total; body.example = false; S.plan = body; render();
      if (S.db) S.db.doc("config/plan").set(body).then(() => toast("Subscriptions budget set to " + money(total)), () => toast("Couldn't save. Try again."));
      return;
    }
    if ((el = t("[data-edit-tx]"))){ const tx = (S.months[el.dataset.month] || []).find((x) => x.id === el.dataset.editTx); if (tx) openLog(null, tx); return; }
    if ((el = t("[data-edit-entry]"))){ openEntryEdit(el.dataset.goal, el.dataset.editEntry); return; }
    if ((el = t("[data-goal-edit]"))){ openGoalEdit(S.goals.find((g) => g.id === el.dataset.goalEdit)); return; }
    if ((el = t("[data-goal-add]"))){ openGoalMoney(S.goals.find((g) => g.id === el.dataset.goalAdd), "add"); return; }
    if ((el = t("[data-goal-use]"))){ openGoalMoney(S.goals.find((g) => g.id === el.dataset.goalUse), "use"); return; }
    if ((el = t("[data-del]"))){ if (S.armed === el.dataset.del) deleteTx(el.dataset.month, el.dataset.del); else { S.armed = el.dataset.del; render(); } return; }
    if ((el = t("[data-rm-inc]"))){ draft.income = draft.income.filter((r) => r.id !== el.dataset.rmInc); el.closest(".prow").remove(); queueSave(); return; }
    if ((el = t("[data-rm-cat]"))){ draft.categories = draft.categories.filter((r) => r.id !== el.dataset.rmCat); el.closest(".prow").remove(); queueSave(); return; }
    if ((el = t("[data-grp]"))){ const row = el.closest("[data-cat]"); const c = draft.categories.find((x) => x.id === row.dataset.cat); c.group = el.dataset.grp; row.querySelectorAll("[data-grp]").forEach((b) => b.setAttribute("aria-pressed", b.dataset.grp === c.group)); queueSave(); return; }
    if ((el = t("[data-role]"))){ const row = el.closest("[data-cat]"); const c = draft.categories.find((x) => x.id === row.dataset.cat); c.role = el.dataset.role; row.querySelectorAll("[data-role]").forEach((b) => b.setAttribute("aria-pressed", b.dataset.role === c.role)); const w = row.querySelector("[data-duewrap]"); if (w) w.hidden = c.role !== "bill"; queueSave(); return; }
    if ((el = t("[data-kind]"))){ const row = el.closest("[data-inc]"); const r = draft.income.find((x) => x.id === row.dataset.inc); r.kind = el.dataset.kind; row.querySelectorAll("[data-kind]").forEach((b) => b.setAttribute("aria-pressed", b.dataset.kind === r.kind)); updatePer(row, r); queueSave(); return; }
  });
  function updatePer(row, r){ const h = row.querySelector("[data-per]"); if (h) h.textContent = (r.kind === "varies" ? "Typical take-home per paycheck" : "Take-home each time") + " · ≈ " + money(num(r.amount) * (FREQ[r.freq] || FREQ.monthly)[1], 0) + "/month"; }
  const onEdit = (e) => {
    if (e.target.id === "cushion" && draft){ draft.cushion = e.target.value; queueSave(); return; }
    const f = e.target.dataset.f; if (!f || !draft) return;
    const ir = e.target.closest("[data-inc]"), cr = e.target.closest("[data-cat]");
    if (ir){ const r = draft.income.find((x) => x.id === ir.dataset.inc); if (r){ r[f] = e.target.value; updatePer(ir, r); } }
    if (cr){ const c = draft.categories.find((x) => x.id === cr.dataset.cat); if (c) c[f] = e.target.value; }
    queueSave();
  };
  app.addEventListener("toggle", (e) => { const d = e.target; if (d && d.matches && d.matches("details[data-dd]")) S.ddOpen = d.open; if (d && d.matches && d.matches("details[data-wk]")) S.wkOpen = d.open; }, true);
  app.addEventListener("input", onEdit);
  app.addEventListener("change", (e) => { if (e.target.tagName === "SELECT") onEdit(e); else if (e.target.id === "coverOver" && draft){ draft.coverOver = e.target.checked; queueSave(); } });

  let toastTimer;
  function toast(msg, action){
    let el = document.querySelector(".toast");
    if (!el){ el = document.createElement("div"); el.className = "toast"; el.setAttribute("role", "status"); document.body.appendChild(el); }
    el.textContent = msg; el.hidden = false;
    if (action){ const b = document.createElement("button"); b.type = "button"; b.textContent = action.label; b.onclick = () => { el.hidden = true; clearTimeout(toastTimer); action.fn(); }; el.appendChild(b); }
    clearTimeout(toastTimer); toastTimer = setTimeout(() => { el.hidden = true; }, action ? 6000 : 2800);
  }

  // ---------------- boot ----------------
  render();
  (async () => {
    let db = null;
    try { db = await window.LocalDB.open(); } catch (e){ db = null; }
    if (db){ try { S.lastBackup = await db.getMeta("lastBackup") || null; S.empty = await db.isEmpty(); } catch (e){}
      try { // a safety copy of your data every time a new version of the app arrives
        const b = (document.querySelector('meta[name="mb-build"]') || {}).content || "";
        if (!S.empty && b && (await db.getMeta("build")) !== b){ await db.snapshot("When an update arrived"); }
        if (b) await db.setMeta("build", b);
        await db.weeklySnapshot();
        S.snaps = await db.snapList(); S.weekly = await db.weeklyList();
      } catch (e){} try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e){} }
    if (!db){ S.status = "offline"; S.plan = starterPlan(); S.goalsLoaded = true; S.months[monthKey(new Date())] = []; render(); return; }
    S.db = db;
    document.addEventListener("visibilitychange", async () => { if (document.hidden) return; try { if (!S.empty && await db.weeklySnapshot()){ S.weekly = await db.weeklyList(); if (S.tab === "guide") render(); } } catch (e){} });
    const _doc = db.doc.bind(db);
    db.doc = (p) => { const d = _doc(p), set = d.set; d.set = async (b) => { await set(b); if (S.empty){ S.empty = false; } }; return d; };
    db.doc("config/plan").onSnapshot((snap) => {
      S.plan = snap.exists ? JSON.parse(JSON.stringify(snap.data())) : null;
      if (S.status === "loading") S.status = "live";
      if (S.tab !== "plan" || !draft) render();
    }, () => { S.status = "offline"; render(); });
    db.collection("goals").onSnapshot((snap) => {
      S.goals = snap.docs.map((d) => ({...JSON.parse(JSON.stringify(d.data())), id: d.id}));
      sortGoals(); S.goalsLoaded = true;
      if (S.tab !== "plan") render(); else refreshPlanSummary();
    }, () => { S.goalsLoaded = true; });
    db.doc("config/subs").onSnapshot((snap) => {
      S.subsList = snap.exists ? JSON.parse(JSON.stringify((snap.data() || {}).items || [])) : [];
      if (S.tab !== "plan") render(); else { const box = document.getElementById("subsBox"); if (box) box.innerHTML = subsBoxHTML(); }
    }, () => {});
    db.doc("config/billskip").onSnapshot((snap) => {
      S.billSkip = snap.exists ? JSON.parse(JSON.stringify(snap.data())) : {};
      if (S.tab !== "plan") render();
    }, () => {});
    db.doc("config/accounts").onSnapshot((snap) => {
      S.accounts = snap.exists ? JSON.parse(JSON.stringify(snap.data())) : null;
      if (S.tab !== "plan") render();
    }, () => {});
    db.doc("config/dashlog").onSnapshot((snap) => {
      S.dash = snap.exists ? {items: [], ...JSON.parse(JSON.stringify(snap.data()))} : {items: []};
      if (S.tab !== "plan") render();
    }, () => {});
    db.doc("config/guide").onSnapshot((snap) => {
      S.guide = snap.exists ? {done: {}, ...JSON.parse(JSON.stringify(snap.data()))} : {done: {}};
      if (S.tab !== "plan") render();
    }, () => {});
    ensureMonth(monthKey(new Date()));
  })();
})();
</script>
<script>
(function(){
  "use strict";
  var reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  var theme = document.documentElement.getAttribute("data-theme");
  var root = document.documentElement;
  function burst(host, x, y, n, dist, size){
    for (var i = 0; i < n; i++){
      var p = document.createElement("span"); p.className = "fx"; var sz = size * (.5 + Math.random() * .9);
      p.style.cssText = "width:" + sz + "px;height:" + sz + "px;left:" + x + "px;top:" + y + "px"; host.appendChild(p);
      var a = Math.random() * Math.PI * 2, d = dist * (.5 + Math.random() * .7);
      var an = p.animate([{transform: "translate(0,0) scale(1)", opacity: 1}, {transform: "translate(" + Math.cos(a) * d + "px," + (Math.sin(a) * d - 14) + "px) scale(.2)", opacity: 0}], {duration: 800 + Math.random() * 600, easing: "cubic-bezier(.2,.7,.3,1)"});
      an.onfinish = (function(el){ return function(){ el.remove(); }; })(p);
    }
  }
  function ripple(host, x, y){
    var r = document.createElement("span"); r.className = "ringx"; r.style.cssText = "width:60px;height:60px;left:" + (x - 30) + "px;top:" + (y - 30) + "px"; host.appendChild(r);
    r.animate([{opacity: .9, transform: "scale(.4)"}, {opacity: 0, transform: "scale(7)"}], {duration: 1200, easing: "ease-out"}).onfinish = function(){ r.remove(); };
  }
  function pulse(sel){ var el = document.querySelector(sel); if (el) el.animate([{transform: "scale(1)"}, {transform: "scale(1.07)"}, {transform: "scale(1)"}], {duration: 460, easing: "ease-out"}); }
  window.__cel = function(o){
    try {
      if (reduce || theme === "classic" || root.getAttribute("data-theme") === "classic") return;
      var host = document.createElement("div"); host.className = "cel"; document.body.appendChild(host);
      var W = window.innerWidth, H = window.innerHeight;
      var fmt = function(v){ return "$" + Number(v).toLocaleString("en-US", {minimumFractionDigits: 2, maximumFractionDigits: 2}); };
      var done = 2600;
      if (o.kind === "income"){
        var chip = document.createElement("div"); chip.className = "chipx"; chip.textContent = "+ " + fmt(o.amount); host.appendChild(chip);
        chip.animate([{opacity: 0, transform: "translate(-50%,10px) scale(.9)"}, {opacity: 1, transform: "translate(-50%,0) scale(1.05)", offset: .2}, {opacity: 1, transform: "translate(-50%,0) scale(1)", offset: .55}, {opacity: 0, transform: "translate(-50%,-" + Math.round(H * .18) + "px) scale(.9)"}], {duration: 1700, easing: "ease-out", fill: "forwards"});
        setTimeout(function(){ ripple(host, W / 2, H * .38 + 20); burst(host, W / 2, H * .38 + 20, 28, 130, 6); pulse(".hero .big"); }, 450);
      } else {
        var bl = document.createElement("div"); bl.className = "bloomx"; host.appendChild(bl);
        bl.animate([{clipPath: "inset(100% 0 0 0)", opacity: 0}, {clipPath: "inset(0 0 0 0)", opacity: 1, offset: .5}, {clipPath: "inset(0 0 0 0)", opacity: 1, offset: .8}, {clipPath: "inset(0 0 0 0)", opacity: 0}], {duration: 2200, easing: "cubic-bezier(.5,0,.2,1)", fill: "forwards"});
        var tgt = o.target || 0, p0 = tgt ? o.before / tgt : 0, p1 = tgt ? o.after / tgt : 0, label = "";
        [1, .75, .5, .25].some(function(m){ if (p0 < m && p1 >= m){ label = m === 1 ? "Goal reached" : Math.round(m * 100) + "% there"; return true; } return false; });
        if (!label) label = "+ " + fmt(o.amount) + " to " + (o.name || "your goal");
        var ml = document.createElement("div"); ml.className = "milex"; ml.textContent = label; host.appendChild(ml);
        ml.animate([{opacity: 0, transform: "translate(-50%,8px)"}, {opacity: 1, transform: "translate(-50%,0)", offset: .3}, {opacity: 1, offset: .8}, {opacity: 0}], {duration: 2200, fill: "forwards"});
        setTimeout(function(){ burst(host, W / 2, H * .44 + 40, 30, 150, 5); ripple(host, W / 2, H * .44 + 70); }, 900);
        done = 3000;
      }
      setTimeout(function(){ host.remove(); }, done);
    } catch (e) {}
  };
  // ----- launch animation, once per open -----
  if (theme === "classic" || reduce) return;
  var seen = false; try { seen = sessionStorage.getItem("rw-intro") === "1"; sessionStorage.setItem("rw-intro", "1"); } catch (e) {}
  if (seen) return;
  var sp = document.createElement("div"); sp.id = "splash"; sp.setAttribute("aria-hidden", "true");
  sp.innerHTML = '<div class="halves"><i></i><i></i></div><div class="in"><div class="rz"></div><div class="nm">' + "Rosewood".split("").map(function(c, i){ return '<span style="--k:' + i + '">' + c + "</span>"; }).join("") + "</div></div>";
  document.body.appendChild(sp);
  var app = document.getElementById("app"); if (app) app.classList.add("intro");
  var gone = function(){ sp.remove(); if (app) app.classList.remove("intro"); };
  sp.addEventListener("click", function(){ sp.style.transition = "opacity .25s"; sp.style.opacity = 0; if (app) app.classList.remove("intro"); setTimeout(function(){ sp.remove(); }, 260); });
  setTimeout(gone, 3000);
  // count the big number up as the screen opens
  setTimeout(function(){
    var el = document.querySelector(".hero .big"); if (!el) return;
    var txt = el.textContent, m = txt.match(/-?\$?([\d,]+(?:\.\d+)?)/); if (!m || /—/.test(txt)) return;
    var to = parseFloat(m[1].replace(/,/g, "")), dec = (m[1].split(".")[1] || "").length, pre = txt.slice(0, txt.indexOf(m[1])), t0 = performance.now(), dur = 1000;
    (function tick(n){ var k = Math.min(1, (n - t0) / dur), e = 1 - Math.pow(1 - k, 3); if (!document.body.contains(el)) return; el.textContent = pre + (to * e).toLocaleString("en-US", {minimumFractionDigits: dec, maximumFractionDigits: dec}); if (k < 1) requestAnimationFrame(tick); else el.textContent = txt; })(t0);
  }, 2300);
})();
</script>
